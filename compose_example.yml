services:
  db:
    image: postgres:17
    container_name: auction_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: db_name
      POSTGRES_USER: db_user_name
      POSTGRES_PASSWORD: db_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: